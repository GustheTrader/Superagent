# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: webserver
  config:
    host: 127.0.0.1
    port: 3084
- id: workspace
  config:
    initialWorkspace: /home/workspace/rea-test
- id: dsh-superagent
  config:
    stateDir: /root/.dsh/state/superagent
- id: llm-pi-ai
  config:
    providers:
      openrouter:
        displayName: OpenRouter
        apiKeyEnv: OPENROUTER_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        models:
          - id: deepseek/deepseek-chat-v3-0324
            name: DeepSeek Chat
            contextWindow: 65536
            maxTokens: 8192
      modal-llm:
        displayName: Modal LLM Endpoint
        apiKeyEnv: MODAL_LLM_KEY
        api: openai-completions
        baseURL: https://jeffgus--llm-endpoint-api.us-east.modal.run/v1
        models:
          - id: dragonfly:deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash (Dragonfly)
            contextWindow: 1048576
            maxTokens: 16384
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash (Ollama)
            contextWindow: 262000
            maxTokens: 16384
          - id: kimi-k2.7-code
            name: Kimi K2.7 Code (Ollama)
            contextWindow: 262000
            maxTokens: 16384
      ollama-cloud:
        displayName: Ollama Cloud
        apiKeyEnv: OLLAMA_CLOUD_API_KEY
        api: openai-completions
        baseURL: https://ollama.com/v1
        models:
          - id: kimi-k2.7-code
            name: Kimi K2.7 Code
            contextWindow: 262000
            maxTokens: 16384
          - id: kimi-k3
            name: Kimi K3
            contextWindow: 1000000
            maxTokens: 16384
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 262000
            maxTokens: 16384
          - id: glm-5.3
            name: GLM 5.3
            contextWindow: 1000000
            maxTokens: 16384
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-default-model
  config:
    provider: modal-llm
    model: dragonfly:deepseek-v4.1-flash
- insert:
    - id: rea-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: rea
        transport: stdio
        command: /home/workspace/rea-test/node_modules/.bin/rea
        args: [ '--mcp' ]
        cwd: /home/workspace/rea-test
        startupTimeoutMs: 60000
        toolCallTimeoutMs: 180000
    - id: session-persistence-jsonl
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 16
        maxTasks: 256
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
